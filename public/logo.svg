<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="32" height="32">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="logoPixel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="none"/>

  <!-- Pixel squares -->
  <rect x="10" y="10" width="5.5" height="5.5" rx="1.5" fill="url(#logoPixel)"/>
  <rect x="10" y="18" width="5.5" height="5.5" rx="1.5" fill="url(#logoPixel)"/>
  <rect x="10" y="26" width="5.5" height="5.5" rx="1.5" fill="url(#logoPixel)"/>
  <rect x="10" y="34" width="5.5" height="5.5" rx="1.5" fill="url(#logoPixel)"/>

  <!-- P shape -->
  <rect x="18" y="10" width="8" height="28" rx="2.5" fill="url(#logoGrad)"/>
  <rect x="18" y="10" width="18" height="8" rx="2.5" fill="url(#logoGrad)"/>
  <rect x="18" y="22" width="14" height="8" rx="2.5" fill="url(#logoGrad)"/>
  <rect x="30" y="10" width="6" height="20" rx="2.5" fill="url(#logoGrad)"/>
</svg>
