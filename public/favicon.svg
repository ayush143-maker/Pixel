<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="pixelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0A0A0B"/>

  <!-- Pixel squares on the left (4 squares) -->
  <rect x="14" y="14" width="7" height="7" rx="2" fill="url(#pixelGrad)"/>
  <rect x="14" y="24" width="7" height="7" rx="2" fill="url(#pixelGrad)"/>
  <rect x="14" y="34" width="7" height="7" rx="2" fill="url(#pixelGrad)"/>
  <rect x="14" y="44" width="7" height="7" rx="2" fill="url(#pixelGrad)"/>

  <!-- The P shape -->
  <!-- Vertical stem -->
  <rect x="24" y="14" width="10" height="36" rx="3" fill="url(#pGrad)"/>
  <!-- Top horizontal bar -->
  <rect x="24" y="14" width="22" height="10" rx="3" fill="url(#pGrad)"/>
  <!-- Middle horizontal bar (the loop of P) -->
  <rect x="24" y="28" width="18" height="10" rx="3" fill="url(#pGrad)"/>
  <!-- Right vertical connector for the loop -->
  <rect x="38" y="14" width="8" height="24" rx="3" fill="url(#pGrad)"/>
</svg>
