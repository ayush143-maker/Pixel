<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reson8 — your room</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#090d12;
    --bg-base-2:#0d131a;
    --panel:#131b24;
    --panel-2:#19232e;
    --border:#243040;
    --cyan:#5fe0e8;
    --blue:#3d8bff;
    --blue-deep:#1747b8;
    --steel:#7e8fa0;
    --text:#eaf2f8;
    --text-muted:#7e8fa0;
  }
  .display{ font-family:'Space Grotesk', sans-serif; }
  *{box-sizing:border-box;}
  html{ max-width:100%; overflow-x:hidden; }
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 50% 0%, var(--bg-base-2), var(--bg-base) 70%);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    max-width:100%;
    overflow-x:hidden;
  }
  img{ max-width:100%; }
  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:32px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .wordmark{ display:flex; align-items:center; gap:7px; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px; color:var(--text-muted); margin-bottom:18px; letter-spacing:0.02em; }
  .wordmark img{ height:26px; width:auto; display:block; }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px;
    letter-spacing:0.01em;
    margin:0 0 6px;
    font-weight:600;
  }
  p.sub{
    color:var(--text-muted);
    font-size:13px;
    margin:0 0 24px;
  }
  input#code{
    width:100%;
    background:var(--bg-base);
    border:1px solid var(--border);
    color:var(--text);
    font-size:26px;
    letter-spacing:8px;
    text-align:center;
    padding:16px 10px;
    border-radius:12px;
    outline:none;
    font-variant-numeric:tabular-nums;
  }
  input#code:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(95,224,232,0.15); }
  button.primary{
    width:100%;
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    border:none;
    background:linear-gradient(120deg, var(--blue), var(--blue-deep));
    color:#fff;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button.primary:hover{ transform:translateY(-1px); box-shadow:0 8px 26px rgba(61,139,255,0.35); }
  .error{ color:#ff7b7b; font-size:12px; margin-top:10px; min-height:14px; }

  /* Room / player view */
  .room{ width:100%; max-width:460px; }
  .status-row{ display:flex; align-items:center; gap:8px; margin-bottom:18px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--text-muted); transition:background .3s ease; }
  .dot.live{ background:var(--cyan); box-shadow:0 0 9px var(--cyan); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.55; } }
  .status-text{ font-size:12px; color:var(--text-muted); letter-spacing:0.03em; text-transform:uppercase; }

  .cover{
    width:100%;
    aspect-ratio:1/1;
    border-radius:16px;
    background:var(--panel-2) center/cover no-repeat;
    border:1px solid var(--border);
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
  }
  .cover::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.55));
  }
  .sync-ring{
    position:absolute; top:12px; right:12px;
    padding:5px 10px;
    border-radius:20px;
    background:rgba(18,18,18,0.7);
    border:1px solid var(--cyan);
    color:var(--cyan);
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    backdrop-filter:blur(4px);
    z-index:2;
    display:none;
  }
  .sync-ring.on{ display:block; }

  .track-title{ font-size:19px; font-weight:600; margin:0 0 2px; }
  .track-artist{ font-size:13px; color:var(--text-muted); margin:0 0 22px; }

  .controls{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:16px; }
  .ctrl-btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ctrl-btn.play{ width:58px; height:58px; background:var(--cyan); color:#0e0e0e; border:none; }
  .ctrl-btn.skip{ width:42px; height:42px; }
  .ctrl-btn.play svg, .ctrl-btn.skip svg{ width:20px; height:20px; }

  .progress{ width:100%; height:4px; background:var(--panel-2); border-radius:2px; overflow:hidden; margin-bottom:8px; }
  .progress-fill{ height:100%; background:var(--cyan); width:0%; transition:width .2s linear; }
  .time-row{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); }

  .playlist{ margin-top:26px; }
  .playlist h3{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin:0 0 10px; }
  .song-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 8px; border-radius:10px; cursor:pointer;
  }
  .song-row:hover{ background:var(--panel-2); }
  .song-row.active{ background:rgba(95,224,232,0.08); }
  .song-thumb{ width:36px; height:36px; border-radius:8px; background:var(--panel-2) center/cover no-repeat; flex-shrink:0; }
  .song-meta{ overflow:hidden; }
  .song-meta .t{ font-size:13px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .song-meta .a{ font-size:11px; color:var(--text-muted); margin:0; }

  .hidden{ display:none !important; }
  audio{ display:none; }

  @media (max-width: 420px){
    body{ padding:16px; }
    .card{ padding:26px 18px; }
    input#code{ font-size:22px; letter-spacing:5px; padding:14px 6px; }
    .controls{ gap:14px; }
    .ctrl-btn.play{ width:52px; height:52px; }
    .ctrl-btn.skip{ width:38px; height:38px; }
  }
</style>
</head>
<body>

  <!-- ENTRY -->
  <div class="card" id="entryCard">
    <div class="wordmark">
      <img src="assets/logo.png" alt="" />
      Reson8
    </div>
    <h1>Enter your code</h1>
    <p class="sub">6-digit code, shared just between the two of you.</p>
    <input id="code" maxlength="6" inputmode="numeric" placeholder="••••••" />
    <button class="primary" id="joinBtn">Connect</button>
    <div class="error" id="entryError"></div>
  </div>

  <!-- ROOM -->
  <div class="room hidden" id="roomView">
    <div class="status-row">
      <div class="dot" id="liveDot"></div>
      <span class="status-text" id="statusText">Connecting…</span>
    </div>

    <div class="cover" id="cover">
      <div class="sync-ring" id="syncRing">● live sync</div>
    </div>
    <p class="track-title" id="trackTitle">—</p>
    <p class="track-artist" id="trackArtist">—</p>

    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="time-row"><span id="timeCur">0:00</span><span id="timeDur">0:00</span></div>

    <div class="controls">
      <button class="ctrl-btn skip" id="prevBtn">⏮</button>
      <button class="ctrl-btn play" id="playBtn">▶</button>
      <button class="ctrl-btn skip" id="nextBtn">⏭</button>
    </div>

    <div class="playlist">
      <h3 id="coupleName">Your songs</h3>
      <div id="songList"></div>
    </div>
  </div>

  <audio id="player"></audio>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
