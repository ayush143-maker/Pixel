<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reson8 — Admin</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#090d12; --panel:#131b24; --panel-2:#19232e; --border:#243040;
    --cyan:#5fe0e8; --blue:#3d8bff; --blue-deep:#1747b8; --text:#eaf2f8; --text-muted:#7e8fa0;
  }
  *{box-sizing:border-box;}
  html{ max-width:100%; overflow-x:hidden; }
  body{ margin:0; background:var(--bg-base); color:var(--text); font-family:'Inter', system-ui, sans-serif; padding:28px; max-width:100%; overflow-x:hidden; }
  .wrap{ max-width:640px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:8px; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; margin-bottom:22px; color:var(--text-muted); }
  .brand img{ height:26px; width:auto; display:block; }
  .song-item{ flex-wrap:wrap; gap:8px; }
  .song-del{ background:transparent; border:1px solid var(--border); color:#ff8a8a; padding:5px 10px; font-size:12px; border-radius:6px; }
  .song-del:hover{ border-color:#ff8a8a; background:rgba(255,138,138,0.08); }
  h1{ font-family:'Space Grotesk', sans-serif; font-size:19px; margin-bottom:4px; font-weight:600; }
  p.sub{ color:var(--text-muted); font-size:13px; margin-top:0; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:18px; }
  label{ display:block; font-size:12px; color:var(--text-muted); margin:12px 0 6px; }
  input, select{ width:100%; background:var(--bg-base); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px; font-family:inherit; }
  input:focus, select:focus{ outline:none; border-color:var(--blue); }
  button{ cursor:pointer; border:none; border-radius:8px; padding:10px 16px; font-weight:600; font-size:13px; }
  .btn-primary{ background:linear-gradient(120deg, var(--blue), var(--blue-deep)); color:#fff; }
  .btn-ghost{ background:var(--panel-2); color:var(--text); border:1px solid var(--border); }
  .row{ display:flex; gap:10px; align-items:end; }
  .code-badge{ display:inline-block; background:var(--panel-2); border:1px solid var(--cyan); color:var(--cyan); padding:6px 14px; border-radius:20px; font-size:18px; letter-spacing:4px; margin-top:8px; }
  .song-item{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .msg{ font-size:12px; margin-top:10px; }
  .msg.ok{ color:var(--cyan); } .msg.err{ color:#ff7b7b; }
  .hidden{ display:none !important; }

  @media (max-width: 480px){
    body{ padding:18px; }
    .card{ padding:18px; }
    .row{ flex-direction:column; align-items:stretch; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="assets/logo.png" alt="" />
    Reson8 Admin
  </div>

  <div id="loginCard" class="card">
    <h1>Admin sign in</h1>
    <p class="sub">Only you can create rooms and upload songs.</p>
    <label>Email</label><input id="email" type="email" />
    <label>Password</label><input id="password" type="password" />
    <div style="margin-top:14px;"><button class="btn-primary" id="loginBtn">Sign in</button></div>
    <div class="msg err" id="loginMsg"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h1>Create a room</h1>
      <label>Couple / gift label (just for you, not shown as a title)</label>
      <input id="coupleName" placeholder="e.g. Riya & Kabir" />
      <div style="margin-top:14px;"><button class="btn-primary" id="createRoomBtn">Create room</button></div>
      <div id="newCode" class="msg ok"></div>
    </div>

    <div class="card">
      <h1>Add a song to a room</h1>
      <label>Room</label>
      <select id="roomSelect"></select>
      <label>Song title</label><input id="songTitle" />
      <label>Artist</label><input id="songArtist" />
      <label>Audio file</label><input id="audioFile" type="file" accept="audio/*" />
      <label>Thumbnail image</label><input id="thumbFile" type="file" accept="image/*" />
      <div style="margin-top:14px;"><button class="btn-primary" id="addSongBtn">Upload &amp; add</button></div>
      <div class="msg" id="songMsg"></div>
      <div id="songList" style="margin-top:16px;"></div>
    </div>

    <div class="card">
      <h1>Contact section</h1>
      <p class="sub">Shown on the public homepage footer.</p>
      <label>Telegram username (no @)</label>
      <input id="tgUsername" placeholder="yourusername" />
      <div style="margin-top:14px;"><button class="btn-primary" id="saveContactBtn">Save</button></div>
      <div class="msg" id="contactMsg"></div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
